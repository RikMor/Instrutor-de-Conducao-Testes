<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Quem quer ser milionário? — Instrutor de Condução</title>
<style>
:root{--n0:#02041a;--n1:#0a1150;--n2:#17207f;--line:#aab6ff;--gold:#f5b72e;--or:#f58a1f;--ok:#17a34a;--ko:#d23a31;--tx:#f3f5ff;--mu:#a9b2e6;
--hex:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);
--hexq:polygon(28px 0,calc(100% - 28px) 0,100% 50%,calc(100% - 28px) 100%,28px 100%,0 50%)}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 Optima,Candara,"Segoe UI",system-ui,sans-serif;
background:radial-gradient(ellipse 80% 60% at 50% 15%,#1f2ca8 0,#0a1150 50%,#02041a 100%) fixed;
padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{max-width:1100px;margin:0 auto;padding:.8rem 1rem 2rem}

/* barra de topo */
.top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.top .sp{flex:1}
.tb{display:inline-block;padding:.35rem .85rem;border:1px solid rgba(170,182,255,.45);border-radius:99px;background:rgba(255,255,255,.07);cursor:pointer;text-decoration:none;color:var(--tx);font-size:.92rem}
.tb:hover{background:rgba(255,255,255,.16)}
.tb.lad{display:none}

/* ecrã inicial */
.start{max-width:640px;margin:1.5rem auto 0}
.start h1{font-size:clamp(2.1rem,7vw,3.6rem);line-height:1.05;margin:.2rem 0 .6rem;color:var(--gold);text-shadow:0 0 28px rgba(245,183,46,.35)}
.start .lead{font-size:1.1rem;color:var(--tx);margin:0 0 1.2rem}
.rules{margin:0 0 1.2rem;padding-left:1.1rem;color:var(--mu)}
.rules li{margin:.25rem 0}
.box{border:1px solid rgba(170,182,255,.35);border-radius:12px;padding:.9rem 1.1rem;margin:1rem 0;background:rgba(5,12,63,.55)}
.box b{display:block;margin-bottom:.3rem}
.box label{display:flex;gap:.6rem;align-items:flex-start;margin:.35rem 0;cursor:pointer}
.box input{accent-color:var(--gold);margin-top:.3rem;width:1rem;height:1rem;flex:none}
.box small{color:var(--mu)}
.best{color:var(--mu);margin:.8rem 0 0}
.bigbtn{position:relative;display:inline-block;border:0;background:var(--gold);color:#2a1800;font-weight:700;font-size:1.15rem;padding:.9rem 3rem;clip-path:var(--hex);cursor:pointer}
.bigbtn:hover:not(:disabled){background:#ffd36b}
.bigbtn:disabled{opacity:.45;cursor:not-allowed}
.bigbtn.alt{background:var(--line)}
.bigbtn.alt:hover{background:#fff}
.bigbtn:focus-visible{outline:none;background:#fff;box-shadow:none}

/* jogo */
.game{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:1.4rem;align-items:start}
.stage{display:flex;flex-direction:column;min-height:calc(100vh - 6rem)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:0 0 .8rem;color:var(--mu)}
.meta b{color:var(--gold);font-size:1.15rem}
.lifes{display:flex;gap:1rem}
.ll{width:78px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.82rem;color:var(--tx)}
.ll .ic{position:relative;display:grid;place-items:center;width:68px;height:44px;border:2px solid var(--line);border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#2a3bd0,#0a1360);font-weight:700;font-size:1rem}
.ll:hover:not(:disabled) .ic{border-color:#fff;background:radial-gradient(ellipse at 50% 30%,#3b4fe8,#101c80)}
.ll:disabled{cursor:default}
.ll.used{opacity:.55}
.ll.used .ic::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(to top right,transparent calc(50% - 2px),#ff5b4f 50%,transparent calc(50% + 2px))}
.ll:focus-visible{outline:none}
.ll:focus-visible .ic{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.info{margin:1rem 0 0;max-width:460px;border:1px solid rgba(170,182,255,.4);border-radius:12px;padding:.8rem 1rem;background:rgba(5,12,63,.7)}
.info b{display:block;margin-bottom:.4rem}
.info p{margin:0}
.bar{display:grid;grid-template-columns:1.4rem 1fr 3rem;gap:.5rem;align-items:center;margin:.25rem 0}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--or),var(--gold));min-width:2px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.qarea{margin-top:auto;padding-top:1.4rem}
.qbox{position:relative;display:grid;place-items:center;min-height:104px;padding:1.2rem 3.4rem;text-align:center;background:var(--line);clip-path:var(--hexq);font-size:clamp(1.05rem,2.3vw,1.45rem);line-height:1.35;white-space:pre-line;margin-bottom:1rem}
.qbox::before{content:"";position:absolute;inset:2px;background:linear-gradient(180deg,#101c78,#050c3f);clip-path:var(--hexq)}
.qbox span{position:relative}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.opts.n3 .opt:nth-child(3){grid-column:1/-1;width:calc(50% - 14px);justify-self:center}
.opt{position:relative;display:flex;align-items:center;gap:.7rem;min-height:58px;padding:.55rem 2rem;border:0;background:var(--line);clip-path:var(--hex);color:var(--tx);text-align:left;cursor:pointer;font-size:clamp(.95rem,1.7vw,1.12rem);line-height:1.3}
.opt::before{content:"";position:absolute;inset:2px;background:linear-gradient(180deg,#0e1a6b,#050c3f);clip-path:var(--hex)}
.opt>*{position:relative}
.opt .ltr{color:var(--or);font-weight:700;flex:none}
.opt:hover:not(:disabled){background:#fff}
.opt:hover:not(:disabled)::before{background:linear-gradient(180deg,#1b2cad,#0b1680)}
.opt:focus-visible{outline:none;background:var(--gold)}
.opt:disabled{cursor:default}
.opt.sel{background:#ffd9a0;color:#1a0e00}
.opt.sel::before{background:linear-gradient(180deg,#ffb340,#ec7400)}
.opt.sel .ltr{color:#5a2c00}
.opt.ok{background:#bdf5d0;color:#fff}
.opt.ok::before{background:linear-gradient(180deg,#27c45e,#0f8a3a)}
.opt.ko{background:#ffc9c4;color:#fff}
.opt.ko::before{background:linear-gradient(180deg,#ee5a50,#b02820)}
.opt.ok .ltr,.opt.ko .ltr{color:#fff}
.opt.gone{opacity:0;pointer-events:none}
.opt.nb{opacity:.5}
.hud{display:flex;flex-wrap:wrap;gap:.3rem .9rem;align-items:center;margin:0 0 .8rem}.hud .rl{cursor:help;font-size:1.25rem}.hud small{flex-basis:100%;color:var(--gold)}
.opts.lock .opt.sel::before{animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin-top:1rem}
.confirm span{margin-right:.4rem}
.b{padding:.55rem 1.3rem;border:1px solid var(--line);border-radius:99px;background:transparent;cursor:pointer}
.b:hover{background:rgba(255,255,255,.14)}
.b.go{background:var(--gold);border-color:var(--gold);color:#2a1800;font-weight:700}
.b.go:hover{background:#ffd36b}
.reveal{margin-top:1rem;padding:.9rem 1.1rem;border-radius:12px;border:1px solid;background:rgba(5,12,63,.75)}
.reveal.good{border-color:#4cd982}
.reveal.bad{border-color:#ff7b70}
.reveal>b{display:block;font-size:1.1rem;margin-bottom:.2rem}
.reveal p{margin:.3rem 0}
.reveal small{color:var(--mu);display:block;margin:.3rem 0}
.reveal .b{margin-top:.5rem}

/* escada */
.ladder{border:1px solid rgba(170,182,255,.35);border-radius:12px;background:rgba(5,12,63,.6);padding:.5rem;position:sticky;top:.8rem}
.ladder ol{list-style:none;margin:0;padding:0}
.ladder li{display:flex;justify-content:space-between;gap:.6rem;padding:.2rem .7rem;border-radius:6px;color:var(--or);font-variant-numeric:tabular-nums}
.ladder li .n{width:1.6rem}
.ladder li .p{flex:1;text-align:right}
.ladder li.safe{color:#fff;font-weight:700}
.ladder li.done{opacity:.5}
.ladder li.cur{background:var(--or);color:#1a0e00;font-weight:700;opacity:1}
.ladder li.cur.win{background:var(--ok);color:#fff}
.ladder .x{display:none;margin:.4rem auto .2rem}

/* modal */
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:1rem;background:rgba(2,4,26,.8);z-index:20}
.dlg{max-width:420px;border:1px solid var(--line);border-radius:14px;padding:1.3rem;background:#0b1260}
.dlg p{margin:0 0 1rem}
.dlg .row{display:flex;gap:.7rem;flex-wrap:wrap}

/* fim */
.end{max-width:700px;margin:1rem auto 0}
.end h1{font-size:clamp(1.8rem,5.5vw,2.8rem);line-height:1.1;margin:.2rem 0 .5rem;color:var(--gold)}
.end .amt{font-size:clamp(2.4rem,9vw,4.2rem);font-weight:800;line-height:1.1;margin:.2rem 0 .8rem;color:#fff;text-shadow:0 0 30px rgba(245,183,46,.45)}
.end .row{display:flex;gap:.9rem;flex-wrap:wrap;margin:1.2rem 0}
.rv{border-top:1px solid rgba(170,182,255,.3);padding:.7rem 0}
.rv .st{font-weight:700}
.rv .st.ok{color:#4cd982}.rv .st.ko{color:#ff7b70}.rv .st.na{color:var(--mu)}
.rv p{margin:.2rem 0}
details summary{cursor:pointer;font-weight:700;margin:.4rem 0}

@media(max-width:860px){
 .game{grid-template-columns:1fr}
 .tb.lad{display:inline-block}
 .ladder{display:none;position:fixed;inset:0;z-index:15;border-radius:0;background:#050c3f;padding:1rem;overflow:auto;position:fixed}
 .ladder.open{display:block}
 .ladder .x{display:block}
 .ladder li{padding:.35rem .9rem;font-size:1.05rem}
 .stage{min-height:0}
}
@media(max-width:700px){
 .opts{grid-template-columns:1fr}
 .opts.n3 .opt:nth-child(3){width:100%}
 .qbox{padding:1rem 2.2rem}
 .lifes{gap:.5rem;justify-content:space-between;width:100%}
 :root{--hex:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);--hexq:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%)}
 .opt{padding:.55rem 1.5rem}
}
@media(prefers-reduced-motion:reduce){.opts.lock .opt.sel::before{animation:none}}
</style></head>
<body>
<div id="app"></div>
<script src="quiz.js"></script>
<script>
(()=>{
const QS=window.QS||[];
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const money=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PRIZE=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const SAFE=[4,9];
const safeAmt=l=>l>=10?32000:l>=5?1000:0;
const LT='ABCD';

/* ---------- perguntas elegíveis ---------- */
// Fora: perguntas com 2 opções, que dependem de imagens/tabelas, ou cujas opções/explicação
// referem outras opções ("todas as anteriores", "alínea b)") — deixam de fazer sentido ao baralhar.
const BAD_Q=/\b(figura|figuras|imagem|imagens|ilustra\w*|fotografia|desenho|ao lado|seguinte sinal|este sinal|estes sinais|esta placa|tabela|gráfico)\b/i;
const BAD_O=/\b(todas|nenhuma|ambas|anteriores|acima|abaixo|alínea)\b|opç|\b[abcd]\)|\b[abcd]\s*(e|ou)\s*[abcd]\b/i;
const BAD_E=/\b(alínea|letra)\b|opç|\b[abcd]\)/i;
const ELIG=(()=>{const seen=new Set(),out=[];
 for(const q of QS){const k=q.q.trim().toLowerCase();if(seen.has(k))continue;seen.add(k);
  if(q.o.length<3||BAD_Q.test(q.q)||q.o.some(o=>BAD_O.test(o))||BAD_E.test(q.e||''))continue;out.push(q)}
 return out})();
// Dificuldade estimada: mais opções, enunciado mais longo e opções mais longas = mais difícil.
const score=q=>q.o.length*14+q.q.length/5+q.o.reduce((a,o)=>a+o.length,0)/q.o.length/4;
const prep=q=>({q:q.q,e:q.e||'',u:q.u,s:q.s,o:shuffle(q.o.map((t,i)=>({t,ok:i===q.a})))});
let POOL=[];
function pickQ(){const g=G,n=POOL.length;let t=Math.min(1,g.lvl/14+(g.kind==='elite'?.18:g.kind==='boss'?.08:0));
 const w=Math.max(4,Math.round(n*.12)),c=Math.round(t*(n-1)),win=()=>POOL.slice(Math.max(0,c-w),c+w+1);
 let cand=win().filter(q=>!g.seen.has(q.q));if(!cand.length){g.seen.clear();cand=win()}
 const q=cand[rnd(0,cand.length-1)];g.seen.add(q.q);return prep(q)}
const RELICS={trevo:['🍀','Trevo','25% de hipótese de um erro não custar vida.'],escudo:['🛡️','Escudo','O primeiro erro de cada andar não custa vida.'],chama:['🔥','Chama','A cada 3 certas seguidas, recuperas 1 vida.'],mealheiro:['🐷','Mealheiro','Ganhas +50% de moedas.'],mochila:['🎒','Mochila','+1 uso de cada ajuda.'],cofre:['🏦','Cofre','Se desistires, ficas com +25% do prémio.']};
const has=k=>G.relics.includes(k);
const walkAmt=g=>{const b=g.lvl?PRIZE[g.lvl-1]:0;return g.relics.includes('cofre')?Math.min(1e6,Math.round(b*1.25)):b};
const giveRelic=k=>{G.relics.push(k);if(k==='mochila'){G.ch.f++;G.ch.a++;G.ch.t++}};
const newRelic=()=>{const l=Object.keys(RELICS).filter(k=>!G.relics.includes(k));return l.length?l[rnd(0,l.length-1)]:null};
const DOORS={q:['❓','Pergunta normal','Ganhas moedas se acertares.'],elite:['🔥','Pergunta de risco','Mais difícil, mais moedas e uma hipótese de relíquia.'],shop:['🛒','Loja','Gasta moedas em relíquias e vidas. Depois segue uma pergunta normal.']};
const HUD=g=>`<div class="hud"><span aria-label="${g.lives} vidas">${'❤️'.repeat(g.lives)}${'🖤'.repeat(Math.max(0,g.max-g.lives))}</span><span>🪙 ${g.coins}</span>${g.relics.map(k=>`<span class="rl" title="${RELICS[k][1]}: ${RELICS[k][2]}" tabindex="0" aria-label="${RELICS[k][1]}: ${RELICS[k][2]}">${RELICS[k][0]}</span>`).join('')}${g.flash?`<small>${g.flash}</small>`:''}</div>`;
const DH=()=>`<p style="margin:0 0 .8rem">Escolhe o teu caminho:</p><div class="opts n${G.doors.length}">${G.doors.map((d,i)=>`<button class="opt" data-door="${i}"><span class="ltr">${DOORS[d][0]}</span><span><b>${DOORS[d][1]}</b><br><small>${DOORS[d][2]}</small></span></button>`).join('')}</div>`;
const SH=()=>`<p style="margin:0 0 .8rem">Loja. Tens 🪙 ${G.coins}.</p><div class="opts n${G.shop.length}">${G.shop.map(k=>{const h=k==='heart',c=h?60:50,r=RELICS[k],nb=G.coins<c||(h&&G.lives>=G.max);return `<button class="opt${nb?' nb':''}" data-buy="${k}" ${nb?'disabled':''}><span class="ltr">${h?'❤️':r[0]}</span><span><b>${h?'Uma vida':r[1]}</b> (🪙 ${c})<br><small>${h?'Recupera 1 vida.':r[2]}</small></span></button>`}).join('')}</div><div class="confirm"><button class="b go" data-act="leave">Seguir para a pergunta</button></div>`;

/* ---------- som (desligado por defeito) ---------- */
let AC=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let SOUND=store.get('qqsm_snd')==='1';
function tone(f,t0,d,type,v){if(!SOUND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type||'sine';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const SFX={
 sel:()=>tone(520,0,.08,'triangle'),
 lock:()=>{tone(110,0,1.6,'sawtooth',.05);tone(165,0,1.6,'sawtooth',.04)},
 ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,'triangle')),
 ko:()=>{tone(196,0,.35,'sawtooth',.1);tone(147,.3,.7,'sawtooth',.1)},
 ll:()=>{tone(880,0,.12,'triangle');tone(1175,.1,.2,'triangle')},
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.14,.4,'triangle'))};

/* ---------- estado ---------- */
let G=null,CFG={sel:null,withU:false,mode:'rl'};
const cnt=(s,wu)=>ELIG.filter(q=>q.s===s&&(wu||!q.u)).length;

/* ---------- ecrã inicial ---------- */
function renderStart(){
 const subs=[...new Set(ELIG.map(q=>q.s))];
 if(!CFG.sel)CFG.sel=new Set(subs);
 const best=+store.get('qqsm_best')||0;
 app.innerHTML=`<div class="top"><a class="tb" href="index.html">Voltar ao início</a><span class="sp"></span>${soundBtn()}</div>
<div class="start"><h1>Quem quer ser milionário?</h1>
<p class="lead">15 perguntas do curso de instrutor de condução. Sobe a escada até ao milhão.</p>
<ul class="rules"><li>A dificuldade sobe ao longo da escada.</li><li>Os patamares seguros são a pergunta 5 (1.000 €) e a pergunta 10 (32.000 €): se errares depois deles, ficas com esse valor.</li><li>Tens três ajudas, cada uma só uma vez: 50:50, o público e o amigo. O público e o amigo são simulados e também se enganam, sobretudo nas perguntas difíceis.</li><li>Podes desistir a qualquer momento e ficar com o prémio já ganho.</li></ul>
<div class="box"><b>Temas</b>${subs.map(s=>`<label><input type="checkbox" class="tp" value="${esc(s)}" ${CFG.sel.has(s)?'checked':''}> <span>${esc(s)} <small class="c" data-s="${esc(s)}"></small></span></label>`).join('')}</div>
<div class="box"><label><input type="checkbox" id="wu" ${CFG.withU?'checked':''}> <span>Incluir perguntas com resposta não confirmada <small id="uc"></small></span></label></div>
<p><button class="bigbtn" id="go" data-act="start">Começar o jogo</button> <small id="avail" style="margin-left:.6rem;color:var(--mu)"></small></p>
${best?`<p class="best">O teu melhor prémio neste dispositivo: <b>${money(best)}</b></p>`:''}</div>`;
 startInfo()}
function startInfo(){
 const sel=new Set([...document.querySelectorAll('.tp:checked')].map(c=>c.value)),wu=$('#wu').checked;
 CFG.sel=sel;CFG.withU=wu;
 document.querySelectorAll('.c').forEach(e=>e.textContent='('+cnt(e.dataset.s,wu)+')');
 $('#uc').textContent='('+ELIG.filter(q=>q.u).length+' no total)';
 const n=ELIG.filter(q=>sel.has(q.s)&&(wu||!q.u)).length;
 $('#avail').textContent=n>=15?n+' perguntas disponíveis':'Escolhe mais temas: são precisas pelo menos 15 perguntas.';
 $('#go').disabled=n<15}
const soundBtn=()=>`<button class="tb" data-act="sound" aria-pressed="${SOUND}">${SOUND?'Som ligado':'Som desligado'}</button>`;

/* ---------- jogo ---------- */
function startGame(){
 if(G&&G.timer)clearTimeout(G.timer);
 POOL=shuffle(ELIG.filter(q=>CFG.sel.has(q.s)&&(CFG.withU||!q.u))).sort((a,b)=>score(a)-score(b));
 const rl=CFG.mode!=='classic';
 G={rl,lvl:0,lives:rl?3:1,max:5,coins:0,relics:[],ch:{f:1,a:1,t:1},streak:0,seen:new Set(),kind:'normal',shield:0,retry:0,notes:[],flash:'',doors:[],shop:null,q:null,phase:'ask',sel:null,gone:new Set(),info:null,hist:[],modal:null,ladder:false,ok:false,end:null};
 enterRung();scrollTo(0,0)}
function enterRung(){const g=G;g.info=null;g.retry=0;
 if(g.rl&&g.lvl%5!==4){g.doors=shuffle(['q','elite','shop']);g.phase='doors';renderPlay()}
 else startQ(g.lvl%5===4?'boss':'normal')}
function startQ(kind){const g=G;g.kind=kind;g.q=pickQ();g.sel=null;g.gone=new Set();g.info=null;g.phase='ask';renderPlay()}
function door(i){const g=G;if(g.phase!=='doors')return;const d=g.doors[i];
 if(d==='shop'){g.shop=shuffle(Object.keys(RELICS).filter(k=>!g.relics.includes(k))).slice(0,2).concat('heart');g.phase='shop';renderPlay()}
 else startQ(d==='q'?'normal':'elite')}
function buy(k){const g=G,c=k==='heart'?60:50;if(g.phase!=='shop'||g.coins<c)return;
 if(k==='heart'){if(g.lives>=g.max)return;g.lives++}else{giveRelic(k);g.shop=g.shop.filter(x=>x!==k)}
 g.coins-=c;SFX.ll();renderPlay()}
function renderPlay(){
 const g=G,q=g.q,ph=g.phase,live=ph==='ask'||ph==='confirm';
 const ladder=PRIZE.map((p,i)=>`<li class="${i===g.lvl?'cur':''}${i===g.lvl&&ph==='reveal'&&g.ok?' win':''}${i<g.lvl?' done':''}${SAFE.includes(i)?' safe':''}"><span class="n">${i+1}</span><span class="p">${money(p)}</span></li>`).reverse().join('');
 const ll=(k,ic,lb)=>`<button class="ll${!g.ch[k]?' used':''}" data-ll="${k}" ${!g.ch[k]||!live?'disabled':''} aria-label="${lb}${!g.ch[k]?' (já usada)':''}"><span class="ic" aria-hidden="true">${ic}</span><span>${lb}${g.ch[k]>1?' ×'+g.ch[k]:''}</span></button>`;
 const L=g.sel!=null?LT[g.sel]:'';
 const right=q?q.o.findIndex(o=>o.ok):0;
 let info='';
 if(g.info&&g.info.type==='aud')info=`<div class="info" role="status"><b>O público votou</b>${q.o.map((o,i)=>g.gone.has(i)?'':`<div class="bar"><span>${LT[i]}</span><i style="width:${g.info.p[i]}%"></i><span>${g.info.p[i]}%</span></div>`).join('')}</div>`;
 if(g.info&&g.info.type==='tel')info=`<div class="info" role="status"><b>O teu amigo diz</b><p>“${esc(g.info.text)}”</p></div>`;
 let below='';
 if(ph==='confirm')below=`<div class="confirm"><span>Resposta final: <b>${L}</b>?</span><button class="b go" data-act="final" data-focus>Sim, é a final</button><button class="b" data-act="cancel">Não</button></div>`;
 if(ph==='reveal'){const last=g.lvl===14;
  below=`<div class="reveal ${g.ok?'good':'bad'}" role="status"><b>${g.ok?(last?'Resposta certa! Ganhaste o prémio máximo.':'Resposta certa!'):'Resposta errada.'}</b>`+
  `<p>${g.ok?'':`A resposta certa era a ${LT[right]}: `}${g.ok?`${LT[right]}: `:''}${esc(cap(q.o[right].t))}</p>${q.e}${g.notes.map(n=>`<small>${n}</small>`).join('')}${q.u?'<small>Esta resposta não está confirmada oficialmente.</small>':''}`+
  `<button class="b go" data-act="next" data-focus>${g.ok?(last?'Ver o resultado':`Pergunta seguinte (${money(PRIZE[g.lvl+1])})`):(g.lives>0?'Tentar outra pergunta':'Ver o resultado')}</button></div>`}
 const modal=g.modal==='walk'?`<div class="ov"><div class="dlg" role="dialog" aria-modal="true"><p>Se desistires, ficas com <b>${money(walkAmt(g))}</b>. Tens a certeza?</p><div class="row"><button class="b go" data-act="walkyes" data-focus>Sim, desistir</button><button class="b" data-act="walkno">Continuar a jogar</button></div></div></div>`:'';
 app.innerHTML=`<div class="top"><a class="tb" href="index.html">Início</a><span class="sp"></span>${soundBtn()}<button class="tb lad" data-act="ladder">Escada</button>${live||ph==='doors'||ph==='shop'?'<button class="tb" data-act="walk">Desistir</button>':''}</div>
<div class="game"><section class="stage"><div class="meta"><span>Pergunta ${g.lvl+1} de 15</span><b>Vale ${money(PRIZE[g.lvl])}</b></div>${g.rl?HUD(g):''}
<div class="lifes">${ll('f','50:50','50:50')}${ll('a','👥','Público')}${ll('t','📞','Amigo')}</div>${info}
<div class="qarea">${ph==='doors'?DH():ph==='shop'?SH():`<div class="qbox"><span>${esc(q.q)}</span></div>
<div class="opts n${q.o.length}${ph==='lock'?' lock':''}">${q.o.map((o,i)=>{let c='opt';
  if(g.gone.has(i))c+=' gone';
  if((ph==='confirm'||ph==='lock')&&g.sel===i)c+=' sel';
  if(ph==='reveal'){if(o.ok)c+=' ok';else if(g.sel===i)c+=' ko'}
  const dis=!live||g.gone.has(i);
  return `<button class="${c}" data-i="${i}" ${dis?'disabled':''} ${g.gone.has(i)?'aria-hidden="true" tabindex="-1"':''} aria-label="${LT[i]}: ${esc(cap(o.t))}"><span class="ltr" aria-hidden="true">${LT[i]}:</span><span>${esc(cap(o.t))}</span></button>`}).join('')}</div>${below}`}</div></section>
<aside class="ladder${g.ladder?' open':''}" aria-label="Escada de prémios"><ol>${ladder}</ol><button class="b x" data-act="ladder">Fechar</button></aside></div>${modal}`;
 const f=document.querySelector('[data-focus]');if(f)f.focus({preventScroll:true});
 if(ph==='reveal'){const r=$('.reveal');if(r)r.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'})}}

function pick(i){const g=G;if(!g||(g.phase!=='ask'&&g.phase!=='confirm')||g.gone.has(i)||i>=g.q.o.length)return;
 g.sel=i;g.phase='confirm';SFX.sel();renderPlay()}
function lockIn(){const g=G;if(g.phase!=='confirm'||g.sel==null)return;
 g.phase='lock';SFX.lock();renderPlay();g.timer=setTimeout(reveal,reduced?600:2200)}
function reveal(){const g=G,q=g.q;g.ok=q.o[g.sel].ok;g.phase='reveal';g.notes=[];g.flash='';
 g.hist.push({q,chosen:g.sel,ok:g.ok});
 if(g.ok){g.streak++;if(g.rl){let c=({normal:10,elite:25,boss:40})[g.kind]+Math.min(g.streak,5)*2;if(has('mealheiro'))c=Math.round(c*1.5);g.coins+=c;g.notes.push('+'+c+' 🪙');
   if(has('chama')&&g.streak%3===0&&g.lives<g.max){g.lives++;g.notes.push('A Chama devolveu-te 1 ❤️.')}}}
 else{g.streak=0;
  if(has('escudo')&&!g.shield){g.shield=1;g.notes.push('O Escudo protegeu-te: não perdeste vida.')}
  else if(has('trevo')&&Math.random()<.25)g.notes.push('O Trevo protegeu-te: não perdeste vida.');
  else{g.lives--;g.notes.push(g.lives>0?'Perdeste 1 ❤️. Vais tentar outra pergunta.':'Ficaste sem vidas.')}}
 (g.ok?SFX.ok:SFX.ko)();renderPlay()}
function next(){const g=G;
 if(!g.ok){if(g.lives<=0)return endGame('lose');g.retry=1;return startQ(g.kind)}
 if(g.lvl===14)return endGame('win');
 let f='';
 if(g.rl&&((g.kind==='elite'&&Math.random()<.5)||g.kind==='boss')){const k=newRelic();if(k){giveRelic(k);f='Nova relíquia: '+RELICS[k][0]+' '+RELICS[k][1]+'. '}}
 if(g.rl&&g.kind==='boss'&&g.lives<g.max){g.lives++;f+='Fim do andar: +1 ❤️.'}
 g.flash=f;g.lvl++;if(g.lvl%5===0)g.shield=0;g.ladder=false;enterRung();scrollTo(0,0)}
function lifeline(k){const g=G;if(!g||!g.ch[k]||(g.phase!=='ask'&&g.phase!=='confirm'))return;
 const q=g.q,tier=g.lvl<5?0:g.lvl<10?1:2,R=q.o.map((_,i)=>i).filter(i=>!g.gone.has(i)),c=R.find(i=>q.o[i].ok);
 g.ch[k]--;SFX.ll();
 if(k==='f'){const wrong=shuffle(R.filter(i=>i!==c));wrong.slice(0,Math.floor(q.o.length/2)).forEach(i=>g.gone.add(i));
  g.info=null;if(g.sel!=null&&g.gone.has(g.sel)){g.sel=null;g.phase='ask'}}
 if(k==='a'){let pc=[rnd(62,88),rnd(42,66),rnd(28,52)][tier];pc=Math.min(94,pc+(q.o.length-R.length)*8);
  let top=c;if(tier===2&&Math.random()<.12){const w=R.filter(i=>i!==c);top=w[rnd(0,w.length-1)]}
  const oth=R.filter(i=>i!==top),w=oth.map(()=>Math.random()+.2),sw=w.reduce((a,b)=>a+b,0),p={};
  oth.forEach((i,j)=>p[i]=Math.round((100-pc)*w[j]/sw));p[top]=pc;
  p[top]+=100-R.reduce((a,i)=>a+p[i],0);g.info={type:'aud',p}}
 if(k==='t'){const acc=[.92,.75,.55][tier],wr=R.filter(i=>i!==c),guess=Math.random()<acc?c:wr[rnd(0,wr.length-1)],r=Math.random(),
  sure=[.7,.4,.2][tier],mid=[.25,.35,.35][tier],l=LT[guess];
  const text=r<sure?`Tenho a certeza, é a ${l}.`:r<sure+mid?`Acho que é a ${l}, mas não ponho as mãos no fogo.`:`Hmm, não sei bem. Se tivesse de escolher, ia na ${l}.`;
  g.info={type:'tel',text}}
 renderPlay()}

/* ---------- fim ---------- */
function endGame(kind){const g=G;if(g.timer)clearTimeout(g.timer);g.walkQ=(g.phase==='ask'||g.phase==='confirm')?g.q:null;
 const amt=kind==='win'?PRIZE[14]:kind==='walk'?walkAmt(g):safeAmt(g.lvl);
 if(amt>(+store.get('qqsm_best')||0))store.set('qqsm_best',String(amt));
 g.phase='end';g.end={kind,amt};g.modal=null;
 (kind==='win'?SFX.win:kind==='lose'?(()=>{}):SFX.ok)();
 renderEnd();scrollTo(0,0)}
function renderEnd(){const g=G,{kind,amt}=g.end,n=g.lvl+1;
 const title=kind==='win'?'Milionário!':kind==='walk'?`Desististe na pergunta ${n}`:g.rl?`Ficaste sem vidas na pergunta ${n}`:`Erraste na pergunta ${n}`;
 const sub=kind==='win'?'Respondeste certo às 15 perguntas.':amt?(kind==='walk'?'Ficas com o prémio que já tinhas ganho.':'Ficas com o último patamar seguro.'):'Desta vez sais sem prémio.';
 const items=g.hist.map((h,i)=>({q:h.q,n:i+1,st:h.ok?'ok':'ko',ch:h.chosen}));
 if(kind==='walk'&&g.walkQ)items.push({q:g.walkQ,n,st:'na',ch:null});
 const rv=items.map(it=>{const r=it.q.o.find(o=>o.ok);
  return `<div class="rv"><span class="st ${it.st}">${it.st==='ok'?'Certa':it.st==='ko'?'Errada':'Sem resposta'}</span> <b>${it.n}.</b> <span style="white-space:pre-line">${esc(it.q.q)}</span>
<p>Resposta certa: ${esc(cap(r.t))}</p>${it.st==='ko'?`<p style="color:var(--mu)">A tua resposta: ${esc(cap(it.q.o[it.ch].t))}</p>`:''}${it.q.e}${it.q.u?'<small style="color:var(--mu)">Esta resposta não está confirmada oficialmente.</small>':''}</div>`}).join('');
 app.innerHTML=`<div class="top"><a class="tb" href="index.html">Voltar ao início</a><span class="sp"></span>${soundBtn()}</div>
<div class="end"><h1>${title}</h1><div class="amt">${money(amt)}</div><p>${sub}</p>${g.rl?`<p>Moedas: 🪙 ${g.coins}. Relíquias: ${g.relics.length?g.relics.map(k=>RELICS[k][0]+' '+RELICS[k][1]).join(', '):'nenhuma'}.</p>`:''}
<div class="row"><button class="bigbtn" data-act="again" data-focus>Jogar outra vez</button><button class="bigbtn alt" data-act="menu">Mudar os temas</button></div>
<details open><summary>Rever as perguntas</summary>${rv}</details></div>`;
 const f=document.querySelector('[data-focus]');if(f)f.focus({preventScroll:true})}

/* ---------- eventos ---------- */
function toggleSound(){SOUND=!SOUND;store.set('qqsm_snd',SOUND?'1':'0');if(SOUND)SFX.sel();
 const b=document.querySelector('[data-act=sound]');if(b){b.textContent=SOUND?'Som ligado':'Som desligado';b.setAttribute('aria-pressed',SOUND)}}
const ACT={
 start:()=>startGame(),final:lockIn,
 cancel:()=>{G.sel=null;G.phase='ask';renderPlay()},next,
 walk:()=>{G.modal='walk';renderPlay()},walkyes:()=>endGame('walk'),walkno:()=>{G.modal=null;renderPlay()},
 sound:toggleSound,ladder:()=>{G.ladder=!G.ladder;renderPlay()},
 leave:()=>startQ('normal'),again:startGame,menu:()=>{G=null;renderStart()}};
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.i!==undefined)return pick(+b.dataset.i);
 if(b.dataset.ll)return lifeline(b.dataset.ll);
 if(b.dataset.door!==undefined)return door(+b.dataset.door);
 if(b.dataset.buy)return buy(b.dataset.buy);
 const f=ACT[b.dataset.act];if(f)f()});
app.addEventListener('change',e=>{if(e.target.matches('.tp,#wu'))startInfo()});
document.addEventListener('keydown',e=>{
 if(!G||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(k==='escape'){if(G.modal){G.modal=null;renderPlay()}else if(G.ladder){G.ladder=false;renderPlay()}else if(G.phase==='confirm')ACT.cancel();return}
 if(G.modal||G.phase==='end'||G.phase==='lock')return;
 const i='abcd'.indexOf(k),j=['1','2','3','4'].indexOf(k),x=i>=0?i:j;
 if(x>=0&&(G.phase==='ask'||G.phase==='confirm'))pick(x);else if(x>=0&&G.phase==='doors'&&x<G.doors.length)door(x)});

if(!QS.length){app.innerHTML='<p style="padding:2rem">Não foi possível carregar as perguntas (quiz.js). Confirma que o ficheiro está na mesma pasta que esta página.</p>'}
else renderStart();
})();
</script>
</body></html>
